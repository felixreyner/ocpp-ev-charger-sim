# Generated by `npm run specs` from specs/src/schemas.ts. Do not edit by hand.
openapi: 3.0.3
info:
  title: OCPP CSMS WebSocket endpoint (WAF enforcement profile)
  version: 1.0.0
  description: |-
    The only HTTP surface a charging station needs on the CSMS: the WebSocket upgrade on `/ocpp/{chargePointId}` (port 9000 in docker-compose).
    Load this file into a WAF / API gateway in "reject anything not described" mode so that only well-formed OCPP handshakes reach the CSMS.
    Every other path, method, query string or request body is undefined here and should be blocked.

    After the upgrade, each WebSocket message is an OCPP-J frame. Their schemas are in `ocpp-messages.openapi.yaml` (per action) and
    `../json-schema/<subprotocol>-inbound-frame.schema.json` (whole frames, ready for a validator). See specs/README.md.

    Generated by `npm run specs` from specs/src/schemas.ts. Do not edit by hand.
servers:
  - url: http://localhost:9000
    description: docker-compose CSMS OCPP port (use https/wss in production)
tags:
  - name: OCPP transport
    description: WebSocket handshake for OCPP-J
paths:
  /ocpp/{chargePointId}:
    get:
      tags:
        - OCPP transport
      operationId: ocppWebSocketUpgrade
      summary: Open the OCPP-J WebSocket for one charging station
      description: HTTP/1.1 GET with WebSocket upgrade headers. No query string and no body. The subprotocol picks the OCPP version; the CSMS answers with the first one it supports. After the upgrade, every text message must match the inbound frame schema for the negotiated subprotocol and be at most 16384 bytes.
      parameters:
        - name: chargePointId
          in: path
          required: true
          description: Charging station identity (max 48 unreserved characters, as in OCPP 2.0.1 security whitepaper).
          schema:
            type: string
            minLength: 1
            maxLength: 48
            pattern: ^[A-Za-z0-9._~:\-]{1,48}$
          example: CP-001
        - name: Upgrade
          in: header
          required: true
          description: Must be "websocket".
          schema:
            type: string
            pattern: ^[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]$
            maxLength: 9
        - name: Connection
          in: header
          required: true
          description: Must contain "Upgrade".
          schema:
            type: string
            pattern: "[Uu][Pp][Gg][Rr][Aa][Dd][Ee]"
            maxLength: 64
        - name: Sec-WebSocket-Version
          in: header
          required: true
          description: RFC 6455 version.
          schema:
            type: string
            enum:
              - "13"
        - name: Sec-WebSocket-Key
          in: header
          required: true
          description: Base64 of 16 random bytes.
          schema:
            type: string
            pattern: ^[A-Za-z0-9+/]{22}==$
            minLength: 24
            maxLength: 24
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: "OCPP subprotocol(s) offered: ocpp1.6 and/or ocpp2.0.1. The CSMS would fall back to 1.6 without it, but legitimate stations always send it, so it is required here."
          schema:
            type: string
            maxLength: 32
            pattern: ^(ocpp1\.6|ocpp2\.0\.1)( *, *(ocpp1\.6|ocpp2\.0\.1))?$
      responses:
        "101":
          description: Switching Protocols. The WebSocket is open and OCPP-J frames follow.
          headers:
            Sec-WebSocket-Protocol:
              description: The OCPP version the CSMS picked.
              schema:
                type: string
                enum:
                  - ocpp1.6
                  - ocpp2.0.1
        "400":
          description: Not a valid WebSocket upgrade, or no supported subprotocol.
      x-ocpp-websocket:
        subprotocols:
          - ocpp1.6
          - ocpp2.0.1
        maxMessageBytes: 16384
        textFramesOnly: true
        inboundFrameSchemas:
          ocpp1.6: ../json-schema/ocpp1.6-inbound-frame.schema.json
          ocpp2.0.1: ../json-schema/ocpp2.0.1-inbound-frame.schema.json
components: {}
