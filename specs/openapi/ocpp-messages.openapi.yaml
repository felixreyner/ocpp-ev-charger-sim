        - NotSupported
        - InternalError
        - ProtocolError
        - SecurityError
        - FormationViolation
        - PropertyConstraintViolation
        - OccurenceConstraintViolation
        - TypeConstraintViolation
        - GenericError
    V201_ErrorCode:
      type: string
      enum:
        - FormatViolation
        - GenericError
        - InternalError
        - MessageTypeNotSupported
        - NotImplemented
        - NotSupported
        - OccurrenceConstraintViolation
        - PropertyConstraintViolation
        - ProtocolError
        - RpcFrameworkError
        - SecurityError
        - TypeConstraintViolation
