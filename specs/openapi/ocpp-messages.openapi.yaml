# Generated by `npm run specs` from specs/src/schemas.ts. Do not edit by hand.
openapi: 3.0.3
info:
  title: OCPP 1.6J / 2.0.1 message catalogue for the simulator CSMS
  version: 1.0.0
  description: |-
    Strict request and response schemas for every OCPP action this CSMS handles or sends, for schema validation and WAF tuning.

    OCPP-J runs over one WebSocket, not HTTP routes, so each action is described as a *virtual* `POST /{subprotocol}/{Action}` operation whose request body is the frame payload.
    Do not publish these paths on the CSMS. Use `ocpp-csms-gateway.openapi.yaml` for HTTP enforcement and the JSON Schemas in `specs/json-schema/` to validate whole WebSocket frames.

    Schemas are stricter than the minimum the CSMS checks: unknown fields are rejected, strings have length and character limits, ids and meter readings have ranges.

    Generated by `npm run specs` from specs/src/schemas.ts. Do not edit by hand.
tags:
  - name: "OCPP 1.6J: charger → CSMS"
    description: CALLs a charging station sends to the CSMS over subprotocol ocpp1.6. This is the traffic to inspect in front of the CSMS.
  - name: "OCPP 1.6J: CSMS → charger"
    description: Commands the CSMS sends to the charging station over ocpp1.6. The "response" is the CALLRESULT the station sends back, which also flows towards the CSMS.
  - name: "OCPP 2.0.1: charger → CSMS"
    description: CALLs a charging station sends to the CSMS over subprotocol ocpp2.0.1. This is the traffic to inspect in front of the CSMS.
  - name: "OCPP 2.0.1: CSMS → charger"
    description: Commands the CSMS sends to the charging station over ocpp2.0.1. The "response" is the CALLRESULT the station sends back, which also flows towards the CSMS.
