      maxLength: 255
      pattern: ^[^\x00-\x1F\x7F]*$
    ErrorDetails:
      type: object
      maxProperties: 20
      description: Free-form error details object
    V16_BootNotification_Request:
      title: OCPP 1.6J BootNotification request (charger → CSMS)
      type: object
      properties:
        chargePointVendor:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^\x00-\x1F\x7F]{1,20}$
        chargePointModel:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^\x00-\x1F\x7F]{1,20}$
        chargePointSerialNumber:
          type: string
          maxLength: 25
          pattern: ^[^\x00-\x1F\x7F]*$
        chargeBoxSerialNumber:
          type: string
          maxLength: 25
          pattern: ^[^\x00-\x1F\x7F]*$
        firmwareVersion:
          type: string
          maxLength: 50
          pattern: ^[^\x00-\x1F\x7F]*$
        iccid:
          type: string
          maxLength: 20
          pattern: ^[^\x00-\x1F\x7F]*$
        imsi:
          type: string
          maxLength: 20
          pattern: ^[^\x00-\x1F\x7F]*$
        meterType:
          type: string
          maxLength: 25
          pattern: ^[^\x00-\x1F\x7F]*$
        meterSerialNumber:
          type: string
          maxLength: 25
          pattern: ^[^\x00-\x1F\x7F]*$
      required:
        - chargePointVendor
        - chargePointModel
      additionalProperties: false
    V16_BootNotification_Response:
      title: OCPP 1.6J BootNotification response (CSMS → charger)
      type: object
      properties:
        status:
          type: string
          enum:
            - Accepted
            - Pending
            - Rejected
        currentTime:
          type: string
          format: date-time
          maxLength: 35
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?(Z|[+-][0-9]{2}:[0-9]{2})$
          description: RFC 3339 date-time, e.g. 2026-01-31T12:00:00.000Z
        interval:
          type: integer
          minimum: 0
          maximum: 86400
      required:
        - status
        - currentTime
        - interval
      additionalProperties: false
    V16_Heartbeat_Request:
      title: OCPP 1.6J Heartbeat request (charger → CSMS)
      type: object
      properties: {}
      additionalProperties: false
      maxProperties: 0
    V16_Heartbeat_Response:
      title: OCPP 1.6J Heartbeat response (CSMS → charger)
      type: object
      properties:
        currentTime:
          type: string
          format: date-time
          maxLength: 35
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?(Z|[+-][0-9]{2}:[0-9]{2})$
          description: RFC 3339 date-time, e.g. 2026-01-31T12:00:00.000Z
      required:
        - currentTime
      additionalProperties: false
    V16_StatusNotification_Request:
      title: OCPP 1.6J StatusNotification request (charger → CSMS)
      type: object
      properties:
        connectorId:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 = the whole charge point
