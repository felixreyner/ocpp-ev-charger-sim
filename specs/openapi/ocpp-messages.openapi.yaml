            measurand:
              type: string
              enum:
                - Current.Export
                - Current.Import
                - Current.Offered
                - Energy.Active.Export.Register
                - Energy.Active.Import.Register
                - Energy.Reactive.Export.Register
                - Energy.Reactive.Import.Register
                - Energy.Active.Export.Interval
                - Energy.Active.Import.Interval
                - Energy.Reactive.Export.Interval
                - Energy.Reactive.Import.Interval
                - Frequency
                - Power.Active.Export
                - Power.Active.Import
                - Power.Offered
                - Power.Reactive.Export
                - Power.Reactive.Import
                - RPM
                - Voltage
            context:
              type: string
              enum:
                - Interruption.Begin
                - Interruption.End
                - Other
                - Sample.Clock
                - Sample.Periodic
                - Transaction.Begin
                - Transaction.End
                - Trigger
            format:
              type: string
              enum:
                - Raw
                - SignedData
            phase:
              type: string
              enum:
                - L1
                - L2
                - L3
                - N
                - L1-N
                - L2-N
                - L3-N
                - L1-L2
                - L2-L3
                - L3-L1
            location:
              type: string
              enum:
                - Body
                - Cable
                - EV
                - Inlet
                - Outlet
            unit:
              type: string
              enum:
                - Wh
                - kWh
                - varh
                - kvarh
                - W
                - kW
                - VA
                - kVA
                - var
                - kvar
                - A
                - V
                - K
                - Celcius
                - Celsius
                - Fahrenheit
                - Percent
          required:
            - value
          additionalProperties: false
          title: Energy, power, current or voltage reading (non-negative)
        - type: object
          properties:
            value:
              type: string
              maxLength: 20
              pattern: ^(100(\.0{1,6})?|[0-9]{1,2}(\.[0-9]{1,6})?)$
              description: Decimal number as a string
            measurand:
              type: string
