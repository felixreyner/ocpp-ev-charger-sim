components:
  schemas:
    MessageId:
      type: string
      minLength: 1
      maxLength: 36
      pattern: ^[\x21-\x7E]{1,36}$
      description: Unique message id; a response repeats the id of the request it answers
    V16_SampledValue:
      oneOf:
        - type: object
          properties:
            value:
              type: string
              maxLength: 20
              pattern: ^[0-9]{1,9}(\.[0-9]{1,6})?$
